<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development - xBismuth Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #2B2B2B 0%, #1a1a1a 50%, #2B2B2B 100%);
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        nav > div {
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }
        
        .nav-link {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            transition: color 0.3s ease;
            position: relative;
            line-height: 1.5;
        }

        .nav-link:hover {
            color: #D4D4D4;
        }

        .nav-link.text-blue-400 {
            color: #D4D4D4;
        }

        .mobile-menu {
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .mobile-menu.open {
            transform: translateX(0);
        }

        .mobile-menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 35;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .mobile-menu-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        #closeMenu {
            color: white;
            background: transparent;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        #closeMenu:hover {
            transform: rotate(90deg);
            color: #D4D4D4;
        }

        #menuBtn {
            color: white;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            transition: transform 0.3s ease;
        }

        #menuBtn:hover {
            transform: scale(1.1);
        }

        #menuBtn svg {
            stroke: currentColor;
        }

        /* Gallery Styles */
        .gallery-section {
            padding: 8rem 2rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .page-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4rem;
            font-size: 1.1rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .page-title {
                font-size: 2rem;
            }
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(212, 212, 212, 0.3);
            border-color: rgba(212, 212, 212, 0.4);
        }

        .gallery-media {
            width: 100%;
            height: 300px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, rgba(6, 182, 212, 0.3) 100%);
        }

        .gallery-media img,
        .gallery-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-media img,
        .gallery-item:hover .gallery-media video {
            transform: scale(1.05);
        }

        .gallery-content {
            padding: 1.5rem;
            flex: 1;
        }

        .gallery-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .gallery-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-media {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(74, 158, 255, 0.3);
        }

        .lightbox-media img,
        .lightbox-media video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
        }

        .lightbox-title {
            margin-top: 1.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            color: white;
        }

        .lightbox-description {
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 600px;
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
        }

        .lightbox-close:hover {
            background: rgba(212, 212, 212, 0.3);
            border-color: rgba(212, 212, 212, 0.5);
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-item {
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 backdrop-blur-sm border-b" style="background: rgba(43, 43, 43, 0.9); border-color: #B3B3B3;">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <a href="splashscreen.html" class="flex items-center space-x-2 cursor-pointer">
                    <img src="assets/Images/logo.png" alt="xBismuth Logo" width="40" height="40" style="object-fit: contain;">
                    <span class="text-lg font-semibold" style="font-family: 'Poppins', sans-serif; font-weight: 600;">xBismuth</span>
                </a>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex space-x-8">
                    <a href="splashscreen.html" class="nav-link">Home</a>
                    <a href="3d-modeling.html" class="nav-link">3D Modeling</a>
                    <a href="web-development.html" class="nav-link text-blue-400">Web Development</a>
                    <a href="uiux-designs.html" class="nav-link">UI/UX Designs</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <button id="menuBtn" class="md:hidden">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Menu Backdrop -->
    <div id="mobileMenuBackdrop" class="mobile-menu-backdrop"></div>
    
    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu fixed right-0 top-0 h-full w-64 backdrop-blur-sm z-40 p-8" style="background: rgba(43, 43, 43, 0.95);">
        <button id="closeMenu" class="absolute top-6 right-6 text-2xl">×</button>
        <div class="flex flex-col space-y-6 mt-16">
            <a href="splashscreen.html" class="nav-link text-lg">Home</a>
            <a href="3d-modeling.html" class="nav-link text-lg">3D Modeling</a>
            <a href="web-development.html" class="nav-link text-lg text-blue-400">Web Development</a>
            <a href="uiux-designs.html" class="nav-link text-lg">UI/UX Designs</a>
        </div>
    </div>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <h1 class="page-title">Web Development</h1>
        <p class="page-subtitle">Screenshots and walkthroughs of websites I've developed</p>
        
        <div class="gallery-grid" id="galleryGrid">
            <!-- Gallery items will be populated here -->
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">×</button>
            <div class="lightbox-media" id="lightboxMedia"></div>
            <h3 class="lightbox-title" id="lightboxTitle"></h3>
            <p class="lightbox-description" id="lightboxDescription"></p>
        </div>
    </div>

    <script>
        // Gallery data
        const galleryItems = [
            {
                title: "KNK Website",
                description: "A modern, responsive website featuring smooth animations and intuitive user interface design.",
                image: "assets/Images/knkscreenshot.png",
                video: "assets/Images/website walkthrough.mp4"
            },
            {
                title: "Landing Page Design",
                description: "A clean and engaging landing page with modern design principles and optimized user experience.",
                image: "assets/Images/landingpage.png"
            }
        ];

        // Populate gallery
        const galleryGrid = document.getElementById('galleryGrid');
        galleryItems.forEach((item, index) => {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item';
            galleryItem.style.animationDelay = `${index * 0.1}s`;
            galleryItem.style.opacity = '0';
            
            galleryItem.innerHTML = `
                <div class="gallery-media">
                    <img src="${item.image}" alt="${item.title}" loading="lazy">
                    ${item.video ? `<video muted loop playsinline><source src="${item.video}" type="video/mp4"></video>` : ''}
                </div>
                <div class="gallery-content">
                    <h3 class="gallery-title">${item.title}</h3>
                    <p class="gallery-description">${item.description}</p>
                </div>
            `;
            
            galleryItem.addEventListener('click', () => openLightbox(item, index));
            
            // Video hover effect
            const video = galleryItem.querySelector('video');
            if (video) {
                galleryItem.addEventListener('mouseenter', () => {
                    video.style.display = 'block';
                    video.style.position = 'absolute';
                    video.style.top = '0';
                    video.style.left = '0';
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'cover';
                    video.play().catch(e => console.log('Video play error:', e));
                    galleryItem.querySelector('img').style.opacity = '0';
                });
                galleryItem.addEventListener('mouseleave', () => {
                    video.pause();
                    video.currentTime = 0;
                    video.style.display = 'none';
                    galleryItem.querySelector('img').style.opacity = '1';
                });
            }
            
            galleryGrid.appendChild(galleryItem);
        });

        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxMedia = document.getElementById('lightboxMedia');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDescription = document.getElementById('lightboxDescription');
        const lightboxClose = document.getElementById('lightboxClose');

        function openLightbox(item, index) {
            lightboxMedia.innerHTML = '';
            
            if (item.video) {
                const video = document.createElement('video');
                video.src = item.video;
                video.controls = true;
                video.autoplay = true;
                video.style.maxWidth = '100%';
                video.style.maxHeight = '80vh';
                video.style.borderRadius = '12px';
                lightboxMedia.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.title;
                lightboxMedia.appendChild(img);
            }
            
            lightboxTitle.textContent = item.title;
            lightboxDescription.textContent = item.description;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            const video = lightboxMedia.querySelector('video');
            if (video) {
                video.pause();
                video.currentTime = 0;
            }
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        // Mobile Menu Toggle
        const menuBtn = document.getElementById('menuBtn');
        const closeMenu = document.getElementById('closeMenu');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuBackdrop = document.getElementById('mobileMenuBackdrop');
        
        function openMobileMenu() {
            mobileMenu.classList.add('open');
            mobileMenuBackdrop.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeMobileMenu() {
            mobileMenu.classList.remove('open');
            mobileMenuBackdrop.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        menuBtn.addEventListener('click', openMobileMenu);
        closeMenu.addEventListener('click', closeMobileMenu);
        mobileMenuBackdrop.addEventListener('click', closeMobileMenu);
        
        // Close mobile menu when clicking a link
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                closeMobileMenu();
            });
        });

        // Animate gallery items on load
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.gallery-item').forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
